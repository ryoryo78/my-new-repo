<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600">
  <!-- pattern-bg.svg: ページ背景に敷く装飾（青海波風の和柄＋星）。bodyの背景画像として使用する -->
  <defs>
    <pattern id="seigaiha" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8b84a" stroke-width="1.3">
        <circle cx="25" cy="50" r="22"/>
        <circle cx="25" cy="50" r="16"/>
        <circle cx="25" cy="50" r="10"/>
        <circle cx="0" cy="0" r="22"/>
        <circle cx="0" cy="0" r="16"/>
        <circle cx="0" cy="0" r="10"/>
        <circle cx="50" cy="0" r="22"/>
        <circle cx="50" cy="0" r="16"/>
        <circle cx="50" cy="0" r="10"/>
      </g>
    </pattern>
  </defs>

  <!-- 左上の波紋 -->
  <g opacity="0.4">
    <rect x="0" y="0" width="320" height="260" fill="url(#seigaiha)"/>
  </g>

  <!-- 右下の波紋 -->
  <g opacity="0.4">
    <rect x="500" y="1340" width="300" height="260" fill="url(#seigaiha)"/>
  </g>

  <!-- 散りばめた星 -->
  <g fill="#e8b84a">
    <circle cx="220" cy="60" r="2.6" opacity="0.75"/>
    <circle cx="500" cy="200" r="1.8" opacity="0.5"/>
    <circle cx="720" cy="340" r="2.2" opacity="0.6"/>
    <circle cx="40" cy="380" r="1.8" opacity="0.5"/>
    <circle cx="300" cy="460" r="2.6" opacity="0.7"/>
    <circle cx="640" cy="560" r="1.8" opacity="0.5"/>
    <circle cx="150" cy="640" r="2.2" opacity="0.6"/>
    <circle cx="420" cy="700" r="1.8" opacity="0.5"/>
    <circle cx="740" cy="840" r="2.6" opacity="0.7"/>
    <circle cx="80" cy="900" r="1.8" opacity="0.5"/>
    <circle cx="350" cy="1040" r="2.2" opacity="0.6"/>
    <circle cx="560" cy="1080" r="1.8" opacity="0.5"/>
    <circle cx="250" cy="1160" r="2.6" opacity="0.7"/>
    <circle cx="480" cy="1300" r="1.8" opacity="0.5"/>
    <circle cx="680" cy="1420" r="2.2" opacity="0.6"/>
    <circle cx="150" cy="1480" r="1.8" opacity="0.5"/>
    <circle cx="380" cy="1550" r="2.6" opacity="0.65"/>
    <circle cx="600" cy="120" r="2.2" opacity="0.6"/>
    <circle cx="100" cy="220" r="1.8" opacity="0.5"/>
    <circle cx="450" cy="850" r="2" opacity="0.55"/>
  </g>
</svg>
